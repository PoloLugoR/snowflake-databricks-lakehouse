version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        data_tests: [unique, not_null]

  - name: dim_product
    columns:
      - name: product_key
        data_tests: [unique, not_null]

  - name: dim_geography
    columns:
      - name: geography_key
        data_tests: [unique, not_null]

  - name: dim_shipping_mode
    columns:
      - name: shipping_mode_key
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: fct_order_items
    description: "One row per order item. Grain: order_item_key."
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: geography_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: shipping_mode_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_shipping_mode')
                field: shipping_mode_key
      - name: date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
